# Hardened reverse proxy for services.tekraze.com
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  charset utf-8;
  sendfile on;
  keepalive_timeout 20s;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;
  client_max_body_size 1m;
  large_client_header_buffers 4 8k;

  # If Cloudflare is in front, restore the real client IP (keep this list updated:
  # https://www.cloudflare.com/ips/) and uncomment:
  # set_real_ip_from 173.245.48.0/20;  ... (all Cloudflare ranges)
  # real_ip_header CF-Connecting-IP;

  limit_req_zone  $binary_remote_addr zone=enquiry:10m rate=6r/m;
  limit_req_zone  $binary_remote_addr zone=pages:10m   rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  upstream next_app { server app:3000; keepalive 16; }

  map $request_method $bad_method { default 1; GET 0; HEAD 0; POST 0; }

  server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://services.tekraze.com$request_uri; }
  }

  # Unknown Host headers get nothing (prevents host-header attacks).
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/services.tekraze.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/services.tekraze.com/privkey.pem;
    return 444;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name services.tekraze.com;

    ssl_certificate     /etc/letsencrypt/live/services.tekraze.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/services.tekraze.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # The app sends the full header set (CSP with nonce, HSTS, etc.). Nginx adds HSTS again so
    # it is present even on error pages it generates itself.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_conn perip 30;
    if ($bad_method) { return 405; }

    # Never serve dotfiles or source maps
    location ~ /\.(?!well-known/) { return 404; }
    location ~ \.map$ { return 404; }

    location = /api/enquiry {
      limit_req zone=enquiry burst=4 nodelay;
      client_max_body_size 16k;
      proxy_pass http://next_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # OVERWRITE (never append) the client IP headers so clients cannot spoof them
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_hide_header X-Powered-By;
      proxy_read_timeout 30s;
    }

    location /_next/static/ {
      proxy_pass http://next_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # OVERWRITE (never append) the client IP headers so clients cannot spoof them
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_hide_header X-Powered-By;
      proxy_read_timeout 30s;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      limit_req zone=pages burst=60 nodelay;
      proxy_pass http://next_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # OVERWRITE (never append) the client IP headers so clients cannot spoof them
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_hide_header X-Powered-By;
      proxy_read_timeout 30s;
    }
  }
}
